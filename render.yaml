# One-Click Phase 1 Free Cloud Hosting on Render (0 USD / 0 EGP)
services:
  - type: web
    name: lm-super-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
